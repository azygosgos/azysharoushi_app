name: sharoushi_app
description: "社会保険労務士試験 学習PWA (個人学習用)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.1.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/subjects.json
    - assets/data/topics.json
    - assets/data/laws.json
    - assets/data/articles.json
    - assets/data/questions.json
    - assets/data/quiz_items.json
    - assets/data/daily_tips.json
    - assets/data/sources.json
